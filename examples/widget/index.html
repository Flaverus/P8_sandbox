<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preferences Widget</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<section id="preferences-widget" class="floating-box" aria-labelledby="widget-heading">
  <h3 id="widget-heading">Site Preferences</h3>
  <div class="widget-content">

    <a href="#navigation" class="accessibility-hidden">Skip to Navigation</a>

    <details>
      <summary>Reduced Motion</summary>
      <div class="option">
        <input type="radio" name="motion" id="motionDefault" value="system">
        <label for="motionDefault">Use system settings</label>
      </div>
      <div class="option">
        <input type="radio" name="motion" id="motionOn" value="true">
        <label for="motionOn">Reduced motion on</label>
      </div>
      <div class="option">
        <input type="radio" name="motion" id="motionOff" value="false">
        <label for="motionOff">Reduced motion off</label>
      </div>
    </details>

    <details>
      <summary>High Contrast</summary>
      <div class="option">
        <input type="radio" name="contrast" id="contrastDefault" value="system">
        <label for="contrastDefault">Use system settings</label>
      </div>
      <div class="option">
        <input type="radio" name="contrast" id="contrastOn" value="true">
        <label for="contrastOn">High contrast on</label>
      </div>
      <div class="option">
        <input type="radio" name="contrast" id="contrastOff" value="false">
        <label for="contrastOff">High contrast off</label>
      </div>
    </details>

    <details>
      <summary>Colorscheme</summary>
      <div class="option">
        <input type="radio" name="colorscheme" id="colorschemeDefault" value="system">
        <label for="colorschemeDefault">Use system settings</label>
      </div>
      <div class="option">
        <input type="radio" name="colorscheme" id="colorschemeLight" value="false">
        <label for="colorschemeLight">Light colorscheme</label>
      </div>
      <div class="option">
        <input type="radio" name="colorscheme" id="colorschemeDark" value="true">
        <label for="colorschemeDark">Dark colorscheme</label>
      </div>
    </details>

  </div>
</section>

<header>
  <nav><a id="navigation" href="../../index.html">← Back to Overview</a></nav>
  <h1>Preferences Widget</h1>
</header>

<main id="main-content">
  <section class="card">
    <h2>Changing Styles</h2>
    <p>Activating and deactivating site preferences leads to a different experience!</p>
    <div class="spinning-container">
      <div class="square"></div>
    </div>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
