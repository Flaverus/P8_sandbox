<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drag and Drop</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <nav><a id="navigation" href="../../index.html">← Back to Overview</a></nav>
  <h1>Accessible Drag and Drop Proposal</h1>
</header>

<main id="main-content">
  <section class="card">
    <h2>Kanban Board</h2>
    <p>Use the dropdown menus or drag and drop to move tickets between columns.</p>

    <div class="kanban">
      <section>
        <h3>BACKLOG</h3>
        <ol id="area-one" data-identifier="Backlog">
          <li draggable="true" id="one">
            <article>
              <div class="tile-header">
                <a href="#">TICKET-123</a>
                <label>
                  <span class="visually-hidden">Move TICKET-123 to:</span>
                  <select></select>
                </label>
              </div>
              <p>Task description one</p>
            </article>
          </li>
          <li draggable="true" id="two">
            <article>
              <div class="tile-header">
                <a href="#">TICKET-321</a>
                <label>
                  <span class="visually-hidden">Move TICKET-321 to:</span>
                  <select></select>
                </label>
              </div>
              <p>Task description two</p>
            </article>
          </li>
        </ol>
      </section>

      <section>
        <h3>IN DEVELOPMENT</h3>
        <ol id="area-two" data-identifier="In Development"></ol>
      </section>

      <section>
        <h3>DONE</h3>
        <ol id="area-three" data-identifier="Done"></ol>
      </section>
    </div>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
